{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-7">
        <div class="auth-card">
            <div class="glass-orb orb-one"></div>
            <div class="glass-orb orb-two"></div>
            <div class="text-center mb-4 position-relative">
                <h1 class="h3 fw-bold text-glow">Welcome back</h1>
                <p class="text-muted mb-0">Sign in to access your account</p>
            </div>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-decoration-none">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Sign in</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0 text-muted">Don’t have an account? <a href="/register" class="text-decoration-none fw-semibold">Create one</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
